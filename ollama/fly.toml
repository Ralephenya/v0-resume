app = 'cloudwithsteve-ollama'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = 'ollama_models'
  destination = '/root/.ollama'

[http_service]
  internal_port = 11434
  force_https = false
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
