name: Deploy to Fly.io

# New Fly.io deployment pipeline.
# The existing AWS pipeline (deploy.yml) remains untouched.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-fly
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BACKGROUND_IMAGE: ${{ vars.NEXT_PUBLIC_BACKGROUND_IMAGE }}
          NEXT_PUBLIC_CHAT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CHAT_ENDPOINT }}

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Summary
        run: echo "Deployed to Fly.io"
