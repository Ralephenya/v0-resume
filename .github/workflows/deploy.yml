name: Deploy to S3 + CloudFront

# Pushing to main rebuilds the static site and redeploys it to the existing
# S3 bucket behind cloudwithsteve.online, then invalidates CloudFront.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Required for GitHub OIDC -> AWS (no long-lived access keys).
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static site
        run: npm run build
        env:
          # Set these as repo "Variables" (Settings -> Secrets and variables -> Actions -> Variables)
          NEXT_PUBLIC_BACKGROUND_IMAGE: ${{ vars.NEXT_PUBLIC_BACKGROUND_IMAGE }}
          NEXT_PUBLIC_CHAT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CHAT_ENDPOINT }}

      - name: Configure AWS credentials (OIDC — no secrets needed)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::017117988452:role/resume-github-actions
          aws-region: af-south-1

      - name: Sync to S3
        env:
          S3_BUCKET: 0171-1798-8452-my-bucket
        run: |
          # Long-cache the immutable hashed assets, no-cache the HTML.
          aws s3 sync ./out "s3://$S3_BUCKET" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "*.txt"
          aws s3 sync ./out "s3://$S3_BUCKET" \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.txt"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2VV89C2YG4XWJ \
            --paths "/*"

      - name: Summary
        run: echo "✅ Deployed to https://cloudwithsteve.online"
