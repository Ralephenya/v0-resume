version: 0.2

# Per-visitor preview build. Triggered by the resume-preview Lambda via StartBuild
# with env overrides PREVIEW_ID and PREVIEW_IMAGE_URL. Clones the public repo,
# builds the site with the visitor's hero image, and deploys to its own bucket.
env:
  variables:
    REPO_URL: "https://github.com/Ralephenya/v0-resume.git"
    REGION: "af-south-1"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Preview $PREVIEW_ID | image=$PREVIEW_IMAGE_URL"
      - git clone --depth 1 "$REPO_URL" app

  build:
    commands:
      - cd app
      - export NEXT_PUBLIC_BACKGROUND_IMAGE="$PREVIEW_IMAGE_URL"
      - npm ci --legacy-peer-deps
      - npm run build

  post_build:
    commands:
      - export BUCKET="resume-preview-${PREVIEW_ID}"
      - echo "Provisioning $BUCKET"
      - aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" --create-bucket-configuration LocationConstraint="$REGION"
      - aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
      - aws s3 website "s3://$BUCKET" --index-document index.html --error-document index.html
      - aws s3api put-bucket-policy --bucket "$BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"PublicRead\",\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::$BUCKET/*\"}]}"
      - aws s3api put-bucket-tagging --bucket "$BUCKET" --tagging "TagSet=[{Key=purpose,Value=resume-preview},{Key=createdAt,Value=$(date -u +%Y-%m-%dT%H:%M:%SZ)}]"
      - aws s3 sync app/out "s3://$BUCKET" --delete
      - echo "Live at http://$BUCKET.s3-website.$REGION.amazonaws.com"
