# Template used by preview-fly.yml to deploy visitor preview apps.
# The workflow replaces PREVIEW_APP_NAME with the real app name before deploying.
app = 'PREVIEW_APP_NAME'
primary_region = 'jnb'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
